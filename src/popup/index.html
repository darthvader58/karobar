<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karobar</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        width: 320px;
        min-height: 200px;
        background: #fff;
        color: #1a1a1a;
      }
      header {
        background: #1a73e8;
        color: #fff;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .section {
        padding: 12px 16px;
        border-bottom: 1px solid #e8eaed;
      }
      .section:last-child { border-bottom: none; }
      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #5f6368;
        margin-bottom: 8px;
      }
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 500;
      }
      .badge-green { background: #e6f4ea; color: #137333; }
      .badge-red   { background: #fce8e6; color: #c5221f; }
      button {
        cursor: pointer;
        border: none;
        border-radius: 4px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 500;
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      .btn-primary { background: #1a73e8; color: #fff; }
      .btn-primary:hover { background: #1557b0; }
      .btn-danger  { background: #fce8e6; color: #c5221f; }
      .btn-danger:hover { background: #f5c6c3; }
      .btn-secondary { background: #f1f3f4; color: #3c4043; }
      .btn-secondary:hover { background: #e8eaed; }
      input[type="text"] {
        width: 100%;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 12px;
        margin-bottom: 6px;
        outline: none;
      }
      input[type="text"]:focus { border-color: #1a73e8; }
      .info-msg { color: #1a73e8; font-size: 11px; margin-top: 4px; }
      .error-msg { color: #c5221f; font-size: 11px; margin-top: 4px; }
      .success-msg { color: #137333; font-size: 11px; margin-top: 4px; }
      .sheet-link { font-size: 11px; color: #1a73e8; text-decoration: none; display: block; margin-top: 4px; }
      .sheet-link:hover { text-decoration: underline; }
      .record-item {
        padding: 6px 0;
        border-bottom: 1px solid #f1f3f4;
        font-size: 12px;
      }
      .record-item:last-child { border-bottom: none; }
      .record-title { font-weight: 500; }
      .record-meta { color: #5f6368; font-size: 11px; margin-top: 1px; }
      .failed-item {
        padding: 6px 0;
        border-bottom: 1px solid #f1f3f4;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .failed-item:last-child { border-bottom: none; }
      .empty-msg { color: #5f6368; font-size: 12px; }
      .pattern-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 12px;
        font-family: monospace;
      }
      .pattern-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .input-row { display: flex; gap: 6px; }
      .input-row input { margin-bottom: 0; flex: 1; }
    </style>
  </head>
  <body>
    <header>Karobar</header>
    <div id="app"></div>
    <script src="../dist/popup.js"></script>
  </body>
</html>
